<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Fix Customer Service</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#141310;--grey:#5F594F;--marker:#FBDD5C;--rule:#E6DFD3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:var(--ink);
    font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:18px;line-height:1.55;padding:24px}
  main{max-width:560px}
  h1{font-weight:800;letter-spacing:-.03em;line-height:1;font-size:clamp(2.4rem,9vw,4rem);margin:0 0 18px}
  mark{background:linear-gradient(transparent 10%,var(--marker) 10%,var(--marker) 88%,transparent 88%);padding:0 .1em}
  p{color:var(--grey);margin:0 0 26px;max-width:34em}
  a.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;
    padding:16px 26px;border-radius:6px}
  a.btn:hover{background:#2a2822}
  .links{margin-top:22px;font-size:.98rem;color:var(--grey)}
  .links a{color:var(--ink);font-weight:600;border-bottom:2px solid var(--marker);text-decoration:none}
  a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>This page <mark>never got answered.</mark></h1>
  <p>The address you followed doesn't exist — a broken link, a typo, or something that's moved. Everything worth reading is on the one page anyway.</p>
  <a class="btn" href="/">Back to the main page</a>
  <p class="links">Or jump straight to <a href="/#cost">what poor support costs you</a>, <a href="/#how">how the work runs</a>, or <a href="/#talk">booking a call</a>.</p>
</main>
</body>
</html>
