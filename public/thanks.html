<style>
  /* floating WhatsApp widget, every page: circle + one-time proactive bubble */
  .wa-float{position:fixed;right:18px;bottom:18px;z-index:60;width:58px;height:58px;border-radius:50%;
    background:linear-gradient(180deg,#57d163 0%,#2bb43c 100%);display:grid;place-items:center;
    border:1px solid rgba(20,19,16,.08);box-shadow:0 8px 24px rgba(20,19,16,.28);transition:transform .15s ease}
  .wa-float:hover{transform:scale(1.07)}
  .wa-float:focus-visible{outline:3px solid #141310;outline-offset:3px}
  .wa-float svg{width:32px;height:32px;fill:#fff;display:block}
  .wa-float::after{content:"";position:absolute;inset:-1px;border-radius:50%;pointer-events:none;opacity:0}
  .wa-float.pulse::after{animation:waPing 2.4s ease-out 2}
  @keyframes waPing{
    0%{box-shadow:0 0 0 0 rgba(43,180,60,.55);opacity:1}
    100%{box-shadow:0 0 0 26px rgba(43,180,60,0);opacity:0}
  }
  .wa-bubble{position:fixed;right:18px;bottom:86px;z-index:60;width:min(300px,calc(100vw - 28px));
    background:#fff;border-radius:14px 14px 4px 14px;box-shadow:0 14px 34px rgba(20,19,16,.22);padding:14px 16px 15px;
    opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.2,1)}
  .wa-bubble.show{opacity:1;transform:none;pointer-events:auto}
  .wa-bubble .close{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;
    font:inherit;font-size:15px;line-height:1;color:#9A958A;padding:6px}
  .wa-bubble .close:hover{color:#141310}
  .wa-bubble .close:focus-visible{outline:2px solid #141310;outline-offset:2px}
  .wa-bubble .msg{display:block;text-decoration:none;color:#141310}
  .wa-bubble .who{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-right:18px}
  .wa-bubble .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#141310;color:#FBDD5C;
    display:grid;place-items:center;font-weight:800;font-size:16px}
  .wa-bubble .who b{font-size:.92rem;line-height:1.25}
  .wa-bubble .online{margin-left:auto;text-align:center;font-size:.66rem;font-weight:700;color:#2bb43c;line-height:1.3}
  .wa-bubble .online i{display:block;width:8px;height:8px;border-radius:50%;background:#2bb43c;margin:0 auto 2px;font-style:normal}
  .wa-bubble p{margin:0;font-size:.9rem;line-height:1.45;color:#5F594F}
  @media (max-width:900px){
    .wa-float{width:54px;height:54px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}
    .wa-float svg{width:30px;height:30px}
    .wa-bubble{right:14px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:240px}
  }
  @media (prefers-reduced-motion:reduce){
    .wa-bubble{transition:none}
    .wa-float.pulse::after{animation:none}
  }
</style>

<script>
(function(){
  var bub = document.getElementById('wa-bubble');
  var btn = document.querySelector('.wa-float');
  if (!bub || !btn) return;
  var KEY = 'wa_bubble_shown';
  var seen = null;
  try { seen = sessionStorage.getItem(KEY); } catch (e) {}
  if (seen) return;
  setTimeout(function(){
    /* someone already reading the contact section is converting; leave them be */
    var talk = document.getElementById('talk');
    if (talk && talk.getBoundingClientRect().top < window.innerHeight) return;
    bub.classList.add('show');
    btn.classList.add('pulse');
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }, 7000);
  function hide(){ bub.classList.remove('show'); }
  bub.querySelector('.close').addEventListener('click', hide);
  bub.querySelector('.msg').addEventListener('click', hide);
})();
</script>
